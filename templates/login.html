<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - E-Commerce System</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>E-Commerce Management System</h1>
            <h2>Login</h2>
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">Oracle Username</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Enter your Oracle username" required>
                </div>
                <div class="form-group">
                    <label for="password">Oracle Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter your Oracle password" required>
                </div>
                <button type="submit" class="btn-login">Login & Initialize Database</button>
            </form>
            <p class="hint">Use your school Oracle database credentials</p>
            <p class="hint">Login will automatically create tables and insert sample data</p>
        </div>
    </div>
</body>
</html>
